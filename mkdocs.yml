site_name: NANDA
site_url: https://projectnanda.org
site_description: "NANDA - Autonomous Networked Distributed Architectures Research & Documentation"
site_author: "NANDA Initiative"
repo_name: "projnanda"
repo_url: "https://github.com/projnanda"
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Outfit
    code: Fira Code
  palette:
    # Light theme
    - scheme: default
      primary: white
      accent: slate
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Dark theme in shade of #1F1F1F
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

extra:
  generator: false

plugins: []

hooks:
  - hooks/open_in_new_tab.py
  - hooks/generate_agent_and_llm_assets.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "¶"
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Research:
    - Overview: research/index.md
    - Publications: publication/index.md
    - NANDA Index: publication/nanda-index.md
    - Get Involved: publication/get-involved.md
  - Projects:
    - Overview: projects/index.md
    - NEST ↗: https://nest.projectnanda.org/
    - NANDA Town ↗: https://nandatown.projectnanda.org/
    - Civic Agents ↗: https://civicagents.projectnanda.org/
  - Community:
    - Overview: community/index.md
    - Events ↗: https://lu.ma/nanda
    - Start a Chapter!: community/start-a-chapter.md
    - Youth Chapter ↗: https://nandashapers.org/
  - Contribute:
    - Open Source: developer/open-source.md
    - Hackathons: developer/hackathons.md
    - Fellowships: developer/fellowships.md
  - Resources:
    - FAQ: resources/faq.md
    - Talks & Archive: resources/talks-archive.md
  - People & Talent:
    - Advisors & Speakers: people/advisors.md
    - Team: people/team.md
    - Career ↗: https://careers.projectnanda.org/
  - About:
    - Project NANDA: about/index.md
    - Foundation (FAN) ↗: https://www.agenticnet.org/
